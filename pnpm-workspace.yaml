  '@types/npmcli__config': ^6.0.4
  '@types/semver': ^7.8.0
  '@vitest/coverage-istanbul': ^5.0.3
  '@yarnpkg/core': ^4.9.2
  '@yarnpkg/fslib': ^3.1.5
  '@yarnpkg/plugin-npm': ^3.7.1
